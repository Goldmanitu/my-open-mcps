[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-alert-mcp"
version = "0.2.0"
description = "Educational Codex plugin and MCP server for deduplicated Telegram alerts"
requires-python = ">=3.11"
dependencies = ["mcp>=1.27,<2.0"]

[project.urls]
Homepage = "https://github.com/Goldmanitu/my-open-mcps/tree/main/plugins/telegram-alert-mcp"
Repository = "https://github.com/Goldmanitu/my-open-mcps"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
telegram-alert-mcp = "telegram_alert_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
